<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Galería de mesas dulces con diseños únicos">
    <title>Galería - La Magia de Carol</title>
    <link rel="stylesheet" href="stilo.css">
</head>
<body>
    <a href="https://wa.me/34654160403?text=Hola%20quiero%20informaci%C3%B3n"
       class="btn-whatsapp"
       target="_blank"
       aria-label="Abrir WhatsApp">
        <img width="40" src="img/logowat.png" alt="WhatsApp" />
    </a>

    <header class="cabecera">
        <div class="marca">
            <img src="img/logo_la_magia_de_carol.png" alt="Logo de La Magia de Carol" />
            <div>
                <h1>Galería</h1>
                <p>Imágenes que inspiran dulces momentos</p>
            </div>
        </div>
        <nav class="menu-principal" aria-label="Navegación principal">
            <a href="index.html">Inicio</a>
            <a href="sobre-mi.html">Mi historia</a>
            <a href="mistrabajos.html">Mis trabajos</a>
            <a href="galeria.html">Galería</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <main id="content">
        <section class="seccion seccion-blanca">
            <div class="seccion-contenido">
                <h2>Galería de imágenes</h2>
                <p>Explora nuestras mesas dulces más lindas y deja que la inspiración llegue para tu próximo evento.</p>
                <div class="carrusel-mesas" data-carrusel>
                    <button class="carrusel-foto" type="button" data-ampliar-imagen aria-label="Ampliar imagen actual">
                        <img src="img/imgMesas/3b4c2156-6299-44f0-b15a-e5df95850600.jpg" alt="Mesa dulce temática" />
                    </button>
                    <button class="carrusel-control carrusel-anterior" type="button" data-anterior aria-label="Imagen anterior">&#10094;</button>
                    <button class="carrusel-control carrusel-siguiente" type="button" data-siguiente aria-label="Imagen siguiente">&#10095;</button>
                    <span class="carrusel-contador" aria-live="polite"></span>
                </div>
                <div class="galeria-imagenes" data-galeria-imagenes aria-label="Todas las mesas dulces"></div>
                <dialog class="visor-imagen" aria-label="Vista ampliada de imagen">
                    <button class="visor-cerrar" type="button" data-cerrar-visor aria-label="Cerrar imagen">&times;</button>
                    <img src="" alt="" />
                </dialog>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 La Magia de Carol - Todos los derechos reservados</p>
    </footer>

    <script src="funcion.js"></script>
</body>
</html>
